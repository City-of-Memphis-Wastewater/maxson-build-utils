site_name: maxson-build-utils
site_description: maxson-build-utils validates external hyperlinks and internal PDF navigation links, producing reports for automated documentation quality assurance.
site_url: https://city-of-memphis-wastewater.github.io/maxson-build-utils
repo_url: https://github.com/City-of-Memphis-Wastewater/maxson-build-utils
repo_name: City-of-Memphis-Wastewater/maxson-build-utils

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.sections
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight
nav:
  - Home: index.md
  - Quick Start: quickstart.md

  - Concepts:
      - PDF Link Types: concepts/pdf-link-types.md

  - Project:
      - Changelog: CHANGELOG.md

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - tables
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.inlinehilite

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/City-of-Memphis-Wastewater/maxson-build-utils
