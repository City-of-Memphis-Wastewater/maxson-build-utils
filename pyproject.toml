[project]
name = "maxson-build-utils"
dynamic = ["version"]
#description = "A convention-optional build and deployment framework, with an opinionated Maxson project scaffold available as a convenience."
description = "maxson-build-utils (mbu) enables the rollout of Python app's built in the style of Clayton Bennett in 2026. Granular scaffold standup, generalized build tools for rollout to shiv, msix, and more, with a PyProject class in the middle. This app consumes the City-of-Memphis-Wastewater stack, including pyhabitat, typer-helptree, dworshak-env, and blindwindow."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "dworshak-config>=0.2.8",
    "dworshak-env>=0.1.8",
    "pyhabitat>=1.3.13",
    "typer>=0.27.0; python_version >= '3.10'",
    "typer>=0.22.0,<0.24.0; python_version < '3.10'",
    "typer-helptree>=0.2.12",
    "blindwindow>=0.1.5"
]
license = "MIT"
authors = [
    { name = "George Clayton Bennett", email = "george.bennett@memphistn.gov" }
]
maintainers = [
    { name = "George Clayton Bennett", email = "george.bennett@memphistn.gov" }
]

classifiers=[
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers", # library and documentation
    #"Intended Audience :: Other Audience", # Government/engineering docs
    #"Topic :: Scientific/Engineering :: Information Analysis",
    #"Environment :: Console",
    #"Environment :: MacOS X",
    #"Environment :: Win32 (MS Windows)",
    "Typing :: Typed",
    "Development Status :: 3 - Alpha",
    #"Development Status :: 4 - Beta",
    #"Development Status :: 5 - Production/Stable",
]

keywords = [
    "build-tools",
    "build",
    "scaffold",
    "CI/CD",
    "deployment",
]

[project.scripts]
#maxson-build-utils = "maxson_build_utils.__main__:app"
#mbu = "maxson_build_utils.__main__:app"
maxson-build-utils = "maxson_build_utils.cli:app"
mbu = "maxson_build_utils.cli:app"

# add with `uv sync --group dev`, plus other extras, like `--extra pdfium`
[dependency-groups]
dev = [
    "build>=1.3.0",
    "pyinstaller>=6.17.0 ; platform_system == 'Linux' and platform_machine != 'aarch64'", # to avoid on termux
    "shiv>=1.0.8",
    "ruff>=0.7.0 ; platform_system == 'Linux' and platform_machine != 'aarch64'", # to avoid on termux
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
]

[project.optional-dependencies]
pyinstaller = [
    "pyinstaller>=6.17.0",
]
#builds = [
#    "pyinstaller>=6.17",
#]
gui = [
    "maxson-gui-utils>=0.1.23",
] 
web = []

[project.urls]
Homepage = "https://github.com/city-of-memphis-wastewater/maxson-build-utils"
Repository = "https://github.com/city-of-memphis-wastewater/maxson-build-utils"
Issues = "https://github.com/city-of-memphis-wastewater/maxson-build-utils/issues"
Changelog = "https://raw.githubusercontent.com/city-of-memphis-wastewater/maxson-build-utils/main/docs/CHANGELOG.md"

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[tool.uv]
default-groups = ["dev"]
#default-extras = ["pyinstaller", "gui"]

#[tool.uv.sources]
#maxson-build-utils = { path = "src/maxson_build_utils" }
#maxson-build-utils = { path = "." }
#maxson-build-utils = { path = "../maxson-build-utils" }
#pyhabitat = { path = "../pyhabitat/dist/pyhabitat-1.2.3-py3-none-any.whl" }


[tool.setuptools.dynamic]
version = {file = "src/maxson_build_utils/VERSION"}

[tool.setuptools.package-data]
maxson_build_utils = [
    "data/icons/*",
    "data/icons/**/*",
    "scaffold/ci/github/templates/*.yml",
    "scaffold/ci/github/templates/workflows/*.yml",
]

[tool.maxson-build-utils.names]
import = "maxson_build_utils"
pretty = "Maxson Build Utils"

[tool.maxson-build-utils.pyinstaller]
mode = "onedir"
windowed = false
collect_data_pkgs = ["maxson_build_utils", "maxson_gui_utils"]
collect_binary_pkgs = []
collect_metadata_pkgs = ["typer", "click", "rich"]
collect_submodules_pkgs = ["typer", "click", "rich", "maxson_gui_utils","blindwindow"]

[tool.maxson-build-utils.packaging.msix]
publisher = "CN=806FDEBD-B014-4625-85AE-058C714FC7F2"
publisher_display_name = "George Clayton Bennett"
identity_name = "GeorgeClaytonBennett.MaxsonBuildUtils"

[tool.maxson-build-utils.packaging.flatpak]
manifest_filename = ""

[tool.maxson-build-utils.icons]
png-256 = { path = "src/maxson_build_utils/data/icons/water-green_256x256.png" }
png-1024 = { path = "src/maxson_build_utils/data/icons/water-green_1024x1024.png" }
svg = { path = "src/maxson_build_utils/data/icons/water-green.svg" }
ico-256 = { path = "src/maxson_build_utils/data/icons/max-green_256x256.ico" }
icns = { path = "src/maxson_build_utils/data/icons/max-green.icns" }
iconset = { path = "src/maxson_build_utils/data/icons/max-green.iconset" }
