name: Build Canonical Onedir Payload

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  core-build:
    name: Build PyInstaller Onedir
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Install Project & mbu
        run: |
          pip install .
          uv sync --group dev

      - name: Execute Onedir Compilation
        run: uv run mbu build pyinstaller --mode onedir

      - name: Upload Canonical Payload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: canonical-onedir-payload
          path: dist/onedir/
          retention-days: 2
