name: Reusable AppImage Builder

on:
  workflow_call:
    inputs:
      build_script:
        description: 'Path to repository build entrypoint script'
        required: false
        type: string
        default: 'build_executable.py'
      exe_path:
        description: 'Optional target binary executable path, produced by PyInstaller with the onedir setting. Defaults to internal environment state captured during pyinstaller run.'
        required: false
        type: string
        default: ''
      pretty_name:
        description: 'Desktop display name'
        required: true
        type: string
      icon_path:
        description: 'Path to icon asset'
        required: false
        type: string
        default: ''

jobs:
  build-appimage:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install System Dependencies
        run: |
          sudo wget https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O /usr/local/bin/appimagetool
          sudo chmod +x /usr/local/bin/appimagetool
          echo "APPIMAGE_EXTRACT_AND_RUN=1" >> $GITHUB_ENV

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          
      - name: Install Project & Build Tools
        run: |
          uv sync --group dev
          uv pip install maxson-build-utils

      # Execute repo-specific Python script to generate ONEDIR output
      - name: Run PyInstaller Build Script
        run: uv run python ${{ inputs.build_script }}

      - name: Assemble AppImage
        run: |
          uv run maxson-build-utils build-appimage \
            --pretty-name "${{ inputs.pretty_name }}" \
            --icon "${{ inputs.icon_path }}" \
            --exe-path "${{ inputs.exe_path }}" 

      - name: Publish to GitHub Release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          if [ -z "$TAG_NAME" ]; then
            echo "No release tag found on this event. Skipping release upload."
          else
            gh release upload "$TAG_NAME" dist/appimage/*.AppImage --clobber
          fi

      # Optional: Always store as job artifact for non-release manual runs
      - name: Upload Build Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appimage-dist
          path: dist/appimage/*.AppImage