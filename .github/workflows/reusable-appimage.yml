name: Reusable AppImage Builder

on:
  workflow_call:
    inputs:
      app_dir:
        description: 'Path to PyInstaller ONEDIR output directory'
        required: true
        type: string
      exe_name:
        description: 'Target binary executable name'
        required: true
        type: string
      pretty_name:
        description: 'Desktop display name'
        required: true
        type: string
      icon_path:
        description: 'Path to icon asset'
        required: false
        type: string
        default: 'assets/icon.png'

jobs:
  build-appimage:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install System Dependencies
        run: |
          sudo wget https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O /usr/local/bin/appimagetool
          sudo chmod +x /usr/local/bin/appimagetool
          echo "APPIMAGE_EXTRACT_AND_RUN=1" >> $GITHUB_ENV

      - name: Install Project & Build Tools
        run: |
          uv sync --group dev
          uv pip install maxson-build-utils

      - name: Build Onedir Executable
        run: uv run maxson-build-utils build-executable --mode onedir

      - name: Run AppImage Builder CLI
        run: |
          uv run maxson-build-utils build-appimage \
            --app-dir "${{ inputs.app_dir }}" \
            --exe-name "${{ inputs.exe_name }}" \
            --pretty-name "${{ inputs.pretty_name }}" \
            --icon "${{ inputs.icon_path }}"

      - name: Publish to GitHub Release
        shell: bash
        run: gh release upload "${{ github.event.release.tag_name }}" dist/appimage/*.AppImage --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}