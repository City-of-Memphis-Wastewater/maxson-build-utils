name: Reusable Debian Package Builder

on:
  workflow_call:
    inputs:
      run_smoke_test:
        description: 'Run basic execution test on assembled .deb package'
        required: false
        type: boolean
        default: true

jobs:
  build-deb:
    name: Build .deb (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64]

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Validate Packaging Assets
        run: |
          if [ ! -d "packaging/deb" ]; then
            echo "::error::Debian packaging directory not found at: packaging/deb"
            echo "Run 'mbu init packaging deb' locally to scaffold packaging assets."
            exit 1
          fi

      - name: Install system packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev fakeroot

      - name: Infer App Metadata
        run: |
          APP_NAME=$(grep '^Package:' packaging/deb/control | awk '{print $2}')
          IMPORT_NAME=$(uv run python -c "from maxson_build_utils.pyproject import MaxsonPyProject; print(MaxsonPyProject().import_name)")
          VERSION=$(uv run maxson-build-utils version 2>/dev/null || echo "0.1.0")
          ARCH="${{ matrix.arch }}"
          DEB_NAME="${APP_NAME}_${VERSION}_${ARCH}.deb"

          echo "APP_NAME=$APP_NAME" >> $GITHUB_ENV
          echo "IMPORT_NAME=$IMPORT_NAME" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "ARCH=$ARCH" >> $GITHUB_ENV
          echo "DEB_NAME=$DEB_NAME" >> $GITHUB_ENV

      - name: Create package directory structure
        run: |
          mkdir -p build/deb/staging/DEBIAN
          mkdir -p build/deb/staging/opt/$APP_NAME
          mkdir -p build/deb/staging/usr/bin
          mkdir -p build/deb/staging/usr/share/applications
          mkdir -p build/deb/staging/usr/share/icons/hicolor/scalable/apps
          mkdir -p dist/deb

      - name: Create venv and install package
        run: |
          uv build --wheel
          python3 -m venv build/deb/staging/opt/$APP_NAME/venv
          build/deb/staging/opt/$APP_NAME/venv/bin/pip install --upgrade pip
          build/deb/staging/opt/$APP_NAME/venv/bin/pip install dist/*.whl

      - name: Install launcher wrapper
        run: |
          if [ -f "packaging/deb/launcher.sh" ]; then
            install -Dm755 packaging/deb/launcher.sh build/deb/staging/usr/bin/$APP_NAME
          else
            echo -e "#!/bin/bash\nexec /opt/$APP_NAME/venv/bin/$APP_NAME \"\$@\"" > build/deb/staging/usr/bin/$APP_NAME
            chmod +x build/deb/staging/usr/bin/$APP_NAME
          fi

      - name: Install desktop entry and icons
        run: |
          if [ -f "packaging/deb/$APP_NAME.desktop" ]; then
            install -Dm644 packaging/deb/$APP_NAME.desktop build/deb/staging/usr/share/applications/$APP_NAME.desktop
          fi

          ICON_SRC="src/$IMPORT_NAME/data/icons"
          if [ -f "$ICON_SRC/$APP_NAME.svg" ]; then
            cp "$ICON_SRC/$APP_NAME.svg" "build/deb/staging/usr/share/icons/hicolor/scalable/apps/$APP_NAME.svg"
          elif [ -f "$ICON_SRC/placeholder.svg" ]; then
            cp "$ICON_SRC/placeholder.svg" "build/deb/staging/usr/share/icons/hicolor/scalable/apps/$APP_NAME.svg"
          fi

      - name: Generate DEBIAN control file
        run: |
          set -euo pipefail
          sed -e "s/__VERSION__/${VERSION}/g" \
              -e "s/__ARCH__/${ARCH}/g" \
              packaging/deb/control > build/deb/staging/DEBIAN/control

      - name: Build Debian package
        run: |
          fakeroot dpkg-deb --build build/deb/staging "dist/deb/$DEB_NAME"

      - name: Smoke test .deb package
        if: ${{ inputs.run_smoke_test }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ./dist/deb/"$DEB_NAME"
          which $APP_NAME
          $APP_NAME --help || true

      - name: Publish to GitHub Release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          if [ -z "$TAG_NAME" ]; then
            echo "No release tag found on this event. Skipping release upload."
          else
            gh release upload "$TAG_NAME" dist/deb/*.deb --clobber
          fi

      - name: Upload Build Artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: deb-dist-${{ matrix.arch }}
          path: dist/deb/*.deb