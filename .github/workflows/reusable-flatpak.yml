name: Reusable Flatpak Builder

on:
  workflow_call:
    inputs:
      manifest_path:
        description: 'Path to Flatpak YAML/JSON manifest file'
        required: true
        type: string
      app_id:
        description: 'Flatpak Application ID (e.g., io.github.city_of_memphis_wastewater.cellshift)'
        required: true
        type: string
      app_name:
        description: 'Short application name used for binary naming'
        required: true
        type: string
      run_smoke_test:
        description: 'Run basic execution test on assembled Flatpak'
        required: false
        type: boolean
        default: true

jobs:
  build-flatpak:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-24.08
      options: --privileged
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies & Build Tools
        run: |
          uv sync --group dev || true
          uv pip install maxson-build-utils

      - name: Export requirements & Prepare Flatpak Assets
        run: |
          uv export --format requirements-txt --no-editable --no-dev > requirements.txt
          #uv run maxson-build-utils prepare-flatpak
          uv run maxson-build-utils vendor-wheels

      - name: Compute Build Metadata
        run: |
          VERSION=$(uv run dworshak-config get version 2>/dev/null || echo "0.1.0")
          ARCH=$(uname -m)
          FILENAME="${{ inputs.app_name }}-${VERSION}-${ARCH}.flatpak"

          echo "FILENAME=$FILENAME" >> $GITHUB_ENV

      - name: Build and Package Flatpak Bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: ${{ inputs.manifest_path }}
          bundle: ${{ env.FILENAME }}
          run-tests: false
          cache-key: flatpak-builder-${{ github.sha }}

      - name: Smoke test Flatpak installation
        if: ${{ inputs.run_smoke_test }}
        run: |
          set -e
          FLATPAK_FILE=$(find . -name "*.flatpak" | head -n 1)
          flatpak install --user --bundle --noninteractive "$FLATPAK_FILE"
          flatpak run ${{ inputs.app_id }} --help

      - name: Publish to GitHub Release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          if [ -z "$TAG_NAME" ]; then
            echo "No release tag found on this event. Skipping release upload."
          else
            gh release upload "$TAG_NAME" *.flatpak --clobber
          fi

      - name: Upload Build Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flatpak-dist
          path: "*.flatpak"
