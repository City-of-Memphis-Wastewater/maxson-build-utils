name: Reusable Flatpak Builder

on:
  workflow_call:
    inputs:
      manifest_path:
        description: 'Path to Flatpak manifest file (e.g., packaging/flatpak/app.yaml)'
        required: true
        type: string
      run_smoke_test:
        description: 'Run basic execution test on assembled Flatpak'
        required: false
        type: boolean
        default: true

jobs:
  build-flatpak:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-24.08
      options: --privileged
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Packaging Assets
        run: |
          if [ ! -f "${{ inputs.manifest_path }}" ]; then
            echo "::error::Flatpak manifest not found at: ${{ inputs.manifest_path }}"
            echo "Run 'mbu init packaging flatpak' locally to scaffold packaging assets."
            exit 1
          fi

      - name: Infer App Metadata
        run: |
          # 1. Get filename: "io.github.city_of_memphis_wastewater.cellshift.yaml"
          MANIFEST_FILE=$(basename "${{ inputs.manifest_path }}")

          # 2. Strip extension -> "io.github.city_of_memphis_wastewater.cellshift"
          APP_ID="${MANIFEST_FILE%.yaml}"
          APP_ID="${APP_ID%.yml}"

          # 3. Take substring after last dot -> "cellshift"
          APP_NAME="${APP_ID##*.}"

          echo "APP_ID=$APP_ID" >> $GITHUB_ENV
          echo "APP_NAME=$APP_NAME" >> $GITHUB_ENV

      - name: Export requirements & Vendor Wheels
        run: |
          uv export --format requirements-txt --no-editable --no-dev > requirements.txt
          uv run maxson-build-utils vendor-wheels

      - name: Compute Build Metadata
        run: |
          VERSION=$(uv run maxson-build-utils version 2>/dev/null || echo "0.1.0")
          ARCH=$(uname -m)
          FILENAME="${APP_NAME}-${VERSION}-${ARCH}.flatpak"

          mkdir -p dist/flatpak
          echo "FILENAME=$FILENAME" >> $GITHUB_ENV
          echo "OUTPUT_PATH=dist/flatpak/$FILENAME" >> $GITHUB_ENV

      - name: Build and Package Flatpak Bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: ${{ inputs.manifest_path }}
          bundle: ${{ env.OUTPUT_PATH }}
          run-tests: false
          cache-key: flatpak-builder-${{ github.sha }}

      - name: Smoke test Flatpak installation
        if: ${{ inputs.run_smoke_test }}
        run: |
          set -e
          flatpak install --user --bundle --noninteractive "$OUTPUT_PATH"
          flatpak run "$APP_ID" --help || true

      - name: Publish to GitHub Release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          if [ -z "$TAG_NAME" ]; then
            echo "No release tag found on this event. Skipping release upload."
          else
            gh release upload "$TAG_NAME" dist/flatpak/*.flatpak --clobber
          fi

      - name: Upload Build Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flatpak-dist
          path: dist/flatpak/*.flatpak
