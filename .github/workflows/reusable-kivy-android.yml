name: Reusable Kivy Android Builder

on:
  workflow_call:
    inputs:
      app_name:
        description: "Android application display name"
        required: true
        type: string

      buildozer_spec:
        description: "Path to the Buildozer spec file"
        required: false
        type: string
        default: "buildozer.spec"

      artifact_name:
        description: "Uploaded GitHub Actions artifact name"
        required: false
        type: string
        default: "android-release"

      python_version:
        description: "Python version used to run Buildozer"
        required: false
        type: string
        default: "3.13"

      build_command:
        description: "Buildozer Android command"
        required: false
        type: string
        default: "release"

    outputs:
      artifact_name:
        description: "Name of the uploaded Android artifact"
        value: ${{ jobs.build.outputs.artifact_name }}

jobs:
  build:
    name: Build Android AAB
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    outputs:
      artifact_name: ${{ inputs.artifact_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python_version }}

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            cmake \
            libffi-dev \
            libssl-dev \
            automake \
            autopoint \
            gettext

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf \
            https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            git+https://github.com/kivy/buildozer
          python -m pip install \
            legacy-cgi \
            setuptools \
            cython==0.29.34

      - name: Show tool versions
        run: |
          python --version
          java -version
          buildozer --version

      - name: Build Android release
        env:
          BUILDOZER_WARN_ON_ROOT: "0"
          BUILDOZER_ALLOW_ORG_TEST_DOMAIN: "1"
        run: |
          buildozer \
            --profile default \
            android \
            ${{ inputs.build_command }}

      - name: List generated packages
        if: always()
        run: |
          find bin -maxdepth 1 -type f -print 2>/dev/null || true

      - name: Upload Android package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_name }}
          path: |
            bin/*.aab
            bin/*.apk
          if-no-files-found: error
