# .github/workflows/build.yml

name: Build artifacts

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Build wheel & sdist (Linux only)
        if: runner.os == 'Linux'
        run: uv run python -m build

      - name: Build PYZ ZipApp
        run: uv run python build_pyz.py

      - name: Stage artifacts (Linux)
        if: runner.os == 'Linux'
        run: |
          rm -rf dist/upload
          mkdir -p dist/upload
          cp dist/*.whl dist/upload/ 2>/dev/null || true
          cp dist/*.tar.gz dist/upload/ 2>/dev/null || true
          cp dist/zipapp/*.pyz dist/upload/ 2>/dev/null || true

      - name: Stage artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Test-Path dist/upload) { Remove-Item -Path dist/upload -Recurse -Force }
          New-Item -Path dist/upload -ItemType Directory -Force
          # Explicitly copy only binaries and launchers, ignoring hidden dotfiles like .gitignore
          Get-ChildItem -Path "dist/zipapp" -Include "*.pyz", "*.bat" -Recurse | Copy-Item -Destination "dist/upload" -Force

      - name: Attach artifacts to GitHub Release
        shell: bash
        run: |
          gh release upload "${{ github.event.release.tag_name }}" dist/upload/* --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}