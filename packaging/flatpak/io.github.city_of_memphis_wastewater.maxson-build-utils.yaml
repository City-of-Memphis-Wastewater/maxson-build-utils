id: io.github.city_of_memphis_wastewater.maxson-build-utils
branch: main  
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: maxson-build-utils
no-appstream-check: true
appstream-compose: false


# Inherit pre-compiled GUI/Tk modules via extension
add-extensions:
  org.freedesktop.Platform.Extension.tk:
    directory: lib/tk
    version: '24.08'


build-options:
  env:
    APP_ID: io.github.city_of_memphis_wastewater.maxson-build-utils
    APP_NAME: maxson-build-utils
    IMPORT_NAME: maxson_build_utils

modules:
  - name: tcl
    buildsystem: autotools
    subdir: unix
    config-opts:
      - --enable-threads
      - --enable-64bit
    sources:
      - type: archive
        url: https://downloads.sourceforge.net/tcl/tcl8.6.13-src.tar.gz
        sha256: 43a10a66618dbb7894a5708587c0a688a27d1ed9d0200c8b79aea6f6f2d11620

  - name: tk
    buildsystem: autotools
    subdir: unix
    config-opts:
      - --enable-threads
      - --enable-64bit
    sources:
      - type: archive
        url: https://downloads.sourceforge.net/tcl/tk8.6.13-src.tar.gz
        sha256: 2e2d5d0ed032d164530d6e21050943d9f5d73ed4582aa741d348bf12169b13ff

  - name: python3-tkinter
    buildsystem: simple
    build-commands:
      # Rebuild Python's _tkinter C extension targeting /app's Tcl/Tk headers
      - python3 setup.py build_ext --inplace
    sources:
      - type: archive
        url: https://www.python.org/ftp/python/3.12.5/Python-3.12.5.tar.xz
        sha256: 8201c278c2e684070a257c2a71536b13cf14a8647c0a0058b2d415f3ec327598

  - name: maxson-build-utils
    buildsystem: simple
    build-commands:
      # 1. Install wheel
      #- sh -c 'pip3 install --ignore-installed --no-index --find-links=vendor-wheels --prefix=/app dist/whl/*.whl'
      - sh -c 'pip3 install --ignore-installed --no-index --find-links=build/vendor-wheels --prefix=/app build/vendor-wheels/*.whl'

      # 2. Desktop Integration Files
      - install -Dm644 packaging/flatpak/$APP_ID.desktop /app/share/applications/$APP_ID.desktop
      - install -Dm644 packaging/flatpak/$APP_ID.metainfo.xml /app/share/metainfo/$APP_ID.metainfo.xml
      - install -Dm644 src/$IMPORT_NAME/data/icons/placeholder.svg /app/share/icons/hicolor/scalable/apps/$APP_ID.svg

      # 3. License
      - install -Dm644 LICENSE /app/share/licenses/$APP_NAME/LICENSE
    sources:
      - type: dir
        path: ../..
