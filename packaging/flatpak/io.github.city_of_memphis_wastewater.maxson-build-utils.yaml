id: io.github.city_of_memphis_wastewater.maxson-build-utils
branch: main  
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: maxson-build-utils
appstream-compose: false

# To avoid all this tcl, tk, and python3-tkinter manual inclusion with the lib/tk extension, simply specify org.gnome.Platform 
#runtime: org.gnome.Platform
#runtime-version: '46' # or '47' / '50'
#sdk: org.gnome.Sdk


# Inherit pre-compiled GUI/Tk modules via extension
add-extensions:
  org.freedesktop.Platform.Extension.tk:
    directory: lib/tk
    version: '24.08'


build-options:
  env:
    APP_ID: io.github.city_of_memphis_wastewater.maxson-build-utils
    APP_NAME: maxson-build-utils
    IMPORT_NAME: maxson_build_utils

modules:
  - name: tcl
    buildsystem: autotools
    subdir: unix
    config-opts:
      - --enable-threads
      - --enable-64bit
    post-install:
      - chmod -R u+w /app/lib
    sources:
      - type: archive
        url: https://downloads.sourceforge.net/tcl/tcl8.6.13-src.tar.gz
        sha256: 43a1fae7412f61ff11de2cfd05d28cfc3a73762f354a417c62370a54e2caf066

  - name: tk
    buildsystem: autotools
    subdir: unix
    config-opts:
      - --enable-threads
      - --enable-64bit
    post-install:
      - chmod -R u+w /app/lib
    sources:
      - type: archive
        url: https://downloads.sourceforge.net/tcl/tk8.6.13-src.tar.gz
        sha256: 2e65fa069a23365440a3c56c556b8673b5e32a283800d8d9b257e3f584ce0675
  - name: python3-tkinter
    buildsystem: autotools
    config-opts:
      - --with-tcltk-includes=-I/app/include
      - --with-tcltk-libs=-L/app/lib -ltcl8.6 -ltk8.6
    build-commands:
      # Build only the _tkinter C extension library
      - make sharedmods
      # Copy the compiled shared object into the app's Python runtime site-packages
      - mkdir -p /app/lib/python3.12/lib-dynload
      - cp build/lib.linux-*/_tkinter*.so /app/lib/python3.12/lib-dynload/
    sources:
      - type: archive
        url: https://www.python.org/ftp/python/3.12.5/Python-3.12.5.tar.xz
        sha256: fa8a2e12c5e620b09f53e65bcd87550d2e5a1e2e04bf8ba991dcc55113876397


  - name: maxson-build-utils
    buildsystem: simple
    build-commands:
      # 1. Install wheel
      #- sh -c 'pip3 install --ignore-installed --no-index --find-links=vendor-wheels --prefix=/app dist/whl/*.whl'
      - sh -c 'pip3 install --ignore-installed --no-index --find-links=build/vendor-wheels --prefix=/app build/vendor-wheels/*.whl'

      # 2. Desktop Integration Files
      - install -Dm644 packaging/flatpak/$APP_ID.desktop /app/share/applications/$APP_ID.desktop
      - install -Dm644 packaging/flatpak/$APP_ID.metainfo.xml /app/share/metainfo/$APP_ID.metainfo.xml
      - install -Dm644 src/$IMPORT_NAME/data/icons/placeholder.svg /app/share/icons/hicolor/scalable/apps/$APP_ID.svg

      # 3. License
      - install -Dm644 LICENSE /app/share/licenses/$APP_NAME/LICENSE
    sources:
      - type: dir
        path: ../..
